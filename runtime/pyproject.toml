[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heteroes"
version = "0.0.1"
description = "Heterogeneous Evolution Strategies runtime for LLM post-training"
requires-python = ">=3.12"

[project.scripts]
heteroes = "heteroes.v3.__main__:main"

[project.optional-dependencies]
# CPU tests include ledger simulation, offline plots and notebook contract checks.
test = ["pytest", "hypothesis", "simpy", "matplotlib", "ipython"]
# the LoRA weight space of Recipe v3 (ADR-008); not yet in the desktop worker profile
lora = ["peft==0.21.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
