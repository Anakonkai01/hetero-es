[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heteroes"
version = "0.0.1"
description = "Heterogeneous Evolution Strategies runtime for LLM post-training"
requires-python = ">=3.12"

[project.optional-dependencies]
# the ledger tests that search (Hypothesis) and simulate time (SimPy); without them those tests are skipped
test = ["pytest", "hypothesis", "simpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
