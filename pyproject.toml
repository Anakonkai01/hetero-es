[tool.ruff]
line-length = 120
target-version = "py312"
include = ["*.py", "*.pyi"]
extend-exclude = ["docs/evidence", "docs/archive", "runtime/artifacts", "runtime/notebooks", "node_modules", ".venv-backend", ".scratch"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Research imports and fixture imports are audited separately; unused locals are not correctness failures.
ignore = ["F401", "F841", "E731"]

[tool.ruff.lint.per-file-ignores]
"runtime/tests/**/*.py" = ["F811"]
"scripts/local-lab.py" = ["E402"]
